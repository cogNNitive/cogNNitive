name: Unit tests

# Runs the zero-dependency Node unit tests. Kept separate from
# canonical-entry.yml, which is workflow_dispatch-only because its
# manifest-live job is expected to stay red until the gateway publishes /use.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: skills-manager unit tests
        run: node scripts/skills-manager.test.js
