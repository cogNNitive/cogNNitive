<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>iNNfo Model Viewer</title>
  <!--
    Reference shell for the "Compile Model Viewer" procedure.

    The generating agent replaces ONLY the contents of the two JSON blocks below:
      #innfo-schema  -> Schema JSON Contract  (concepts, fields, markers, matrices)
      #innfo-model   -> Model JSON Contract   (meta, elements, matrices)
    Nothing else in this file is edited. The renderer is template-agnostic.
  -->
  <style>
    :root {
      --bg: #f9fafb;
      --surface: #ffffff;
      --surface-2: #f3f4f6;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #1f2937;
      --link: #2563eb;
      --radius: 8px;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --mono: 'SF Mono', ui-monospace, 'Courier New', monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --surface: #1e293b;
        --surface-2: #263549;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --border: #334155;
        --accent: #cbd5e1;
        --link: #60a5fa;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      line-height: 1.55;
    }
    a { color: var(--link); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { font-family: var(--mono); font-size: 0.85em; }

    header {
      padding: 28px 32px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }
    header .badge {
      display: inline-block;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface-2);
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
    }
    header h1 { margin: 0 0 6px; font-size: 1.8rem; font-weight: 800; letter-spacing: -0.5px; }
    header .meta-line { font-size: 0.85rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 18px; }
    header .meta-line span strong { color: var(--text); font-weight: 600; }

    .layout { display: grid; grid-template-columns: 240px 1fr; gap: 0; align-items: start; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    nav.rail {
      position: sticky;
      top: 0;
      align-self: start;
      max-height: 100vh;
      overflow-y: auto;
      padding: 20px 12px;
      border-right: 1px solid var(--border);
      background: var(--surface);
    }
    @media (max-width: 820px) { nav.rail { position: static; max-height: none; border-right: none; border-bottom: 1px solid var(--border); } }
    nav.rail button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      border: none;
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 0.85rem;
      text-align: left;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      border-left: 3px solid transparent;
    }
    nav.rail button:hover { background: var(--surface-2); }
    nav.rail button.active { background: var(--surface-2); border-left-color: var(--accent); font-weight: 700; }
    nav.rail button .count { color: var(--muted); font-size: 0.75rem; font-weight: 600; }

    main { padding: 24px 32px 96px; min-width: 0; }
    .search-wrap { margin-bottom: 24px; }
    .search-wrap input {
      width: 100%;
      max-width: 420px;
      padding: 9px 12px;
      font: inherit;
      font-size: 0.9rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    section.concept { margin-bottom: 40px; scroll-margin-top: 16px; }
    section.concept > h2 {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0 0 4px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    section.concept > h2 .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); flex: none; }
    section.concept > .concept-sub { font-size: 0.8rem; color: var(--muted); margin: 0 0 14px; }

    .element {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      margin-bottom: 10px;
      overflow: hidden;
      scroll-margin-top: 16px;
    }
    .element > .el-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      cursor: pointer;
    }
    .element > .el-head:hover { background: var(--surface-2); }
    .element > .el-head .el-name { font-weight: 700; font-size: 0.92rem; }
    .element > .el-head .chevron { margin-left: auto; color: var(--muted); transition: transform 0.15s; flex: none; }
    .element.open > .el-head .chevron { transform: rotate(90deg); }

    .chip {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--muted);
      white-space: nowrap;
    }
    .chip b { color: var(--text); font-weight: 700; }

    .el-body { display: none; padding: 4px 14px 16px; border-top: 1px solid var(--border); }
    .element.open > .el-body { display: block; }
    .el-body p.desc { margin: 12px 0; font-size: 0.88rem; }
    .el-body table.fields { width: 100%; border-collapse: collapse; font-size: 0.82rem; margin: 8px 0; }
    .el-body table.fields td { padding: 4px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    .el-body table.fields td:first-child { color: var(--muted); width: 160px; font-weight: 600; }
    .el-body .rel-list { list-style: none; padding: 0; margin: 8px 0 0; font-size: 0.82rem; }
    .el-body .rel-list li { padding: 3px 0; }
    .el-body .rel-list .rel-field { color: var(--muted); font-weight: 600; }

    .matrix-block { margin-bottom: 32px; }
    .matrix-block h3 { font-size: 0.95rem; font-weight: 800; margin: 0 0 8px; }
    .matrix-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius); }
    table.matrix { border-collapse: collapse; font-size: 0.78rem; width: 100%; }
    table.matrix th, table.matrix td { border: 1px solid var(--border); padding: 6px 10px; text-align: center; white-space: nowrap; }
    table.matrix thead th { background: var(--surface-2); font-weight: 700; }
    table.matrix tbody th { background: var(--surface-2); text-align: left; font-weight: 700; }
    table.matrix td:empty::after { content: "·"; color: var(--border); }

    .empty-state { color: var(--muted); font-size: 0.9rem; padding: 40px 0; }
    h2.group-title { font-size: 1rem; font-weight: 800; margin: 48px 0 16px; padding-top: 20px; border-top: 1px dashed var(--border); }
  </style>
</head>
<body>
  <header>
    <span class="badge">iNNfo Model Viewer</span>
    <h1 id="doc-title">Model Viewer</h1>
    <div class="meta-line" id="doc-meta"></div>
  </header>

  <div class="layout">
    <nav class="rail" id="rail"></nav>
    <main>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="Filter elements by name or field value…" autocomplete="off" />
      </div>
      <div id="content"></div>
    </main>
  </div>

  <script type="application/json" id="innfo-schema">
{}
  </script>
  <script type="application/json" id="innfo-model">
{}
  </script>

  <script>
    (function () {
      "use strict";

      var COLORS = {
        red: "#ef4444", orange: "#f97316", amber: "#f59e0b", yellow: "#eab308",
        green: "#22c55e", teal: "#14b8a6", blue: "#3b82f6", indigo: "#6366f1",
        violet: "#8b5cf6", purple: "#a855f7", pink: "#ec4899", gray: "#6b7280", grey: "#6b7280"
      };

      function parseJSON(id) {
        var node = document.getElementById(id);
        if (!node) return null;
        try { return JSON.parse(node.textContent.trim() || "{}"); }
        catch (e) { console.error("Bad JSON in #" + id, e); return null; }
      }

      var schema = parseJSON("innfo-schema") || {};
      var model = parseJSON("innfo-model") || {};
      var concepts = Array.isArray(schema.concepts) ? schema.concepts.slice() : [];
      var elements = Array.isArray(model.elements) ? model.elements : [];
      var matrices = Array.isArray(model.matrices) ? model.matrices : [];
      var meta = model.meta || {};

      concepts.sort(function (a, b) { return (b.weight || 0) - (a.weight || 0); });

      var byId = {};
      elements.forEach(function (el) { if (el && el.id) byId[el.id] = el; });

      var elementsByConcept = {};
      elements.forEach(function (el) {
        var k = el.concept || "Uncategorized";
        (elementsByConcept[k] = elementsByConcept[k] || []).push(el);
      });

      // ---- Header ----
      document.getElementById("doc-title").textContent = meta.title || "Model Viewer";
      var metaBits = [];
      if (meta.template) metaBits.push("<span><strong>Template</strong> " + esc(meta.template) + "</span>");
      if (meta.modelVersion) metaBits.push("<span><strong>Model</strong> " + esc(meta.modelVersion) + "</span>");
      if (meta.generated) metaBits.push("<span><strong>Generated</strong> " + esc(String(meta.generated).replace('T', ' ').replace(/\..*/, '')) + "</span>");
      if (meta.sourceUrl) metaBits.push('<span><a href="' + esc(meta.sourceUrl) + '" target="_blank" rel="noopener">source</a></span>');
      document.getElementById("doc-meta").innerHTML = metaBits.join("");

      var content = document.getElementById("content");
      var rail = document.getElementById("rail");

      if (!concepts.length && !elements.length) {
        content.innerHTML = '<div class="empty-state">No data injected. This is the empty reference shell — run the <code>Compile Model Viewer</code> procedure to populate it.</div>';
        return;
      }

      // ---- Rail ----
      var railButtons = [];
      addRailButton("__all", "All concepts", elements.length);
      concepts.forEach(function (c) {
        addRailButton(c.name, c.name, (elementsByConcept[c.name] || []).length);
      });
      // concepts present in the model but absent from schema
      Object.keys(elementsByConcept).forEach(function (name) {
        if (!concepts.some(function (c) { return c.name === name; })) {
          addRailButton(name, name, elementsByConcept[name].length);
        }
      });

      function addRailButton(key, label, count) {
        var b = document.createElement("button");
        b.dataset.key = key;
        b.innerHTML = '<span>' + esc(label) + '</span><span class="count">' + count + '</span>';
        b.addEventListener("click", function () { selectConcept(key); });
        rail.appendChild(b);
        railButtons.push(b);
      }

      var activeConcept = "__all";
      function selectConcept(key) {
        activeConcept = key;
        railButtons.forEach(function (b) { b.classList.toggle("active", b.dataset.key === key); });
        render();
      }

      // ---- Content ----
      var searchInput = document.getElementById("search");
      searchInput.addEventListener("input", render);

      function render() {
        var q = searchInput.value.trim().toLowerCase();
        content.innerHTML = "";

        var order = concepts.map(function (c) { return c.name; });
        Object.keys(elementsByConcept).forEach(function (n) { if (order.indexOf(n) < 0) order.push(n); });

        var shown = 0;
        order.forEach(function (name) {
          if (activeConcept !== "__all" && activeConcept !== name) return;
          var list = (elementsByConcept[name] || []).filter(function (el) { return matchesQuery(el, q); });
          if (!list.length) return;
          shown += list.length;
          content.appendChild(renderConceptSection(name, list));
        });

        if (!shown) {
          var d = document.createElement("div");
          d.className = "empty-state";
          d.textContent = q ? 'No elements match "' + searchInput.value + '".' : "No elements for this concept.";
          content.appendChild(d);
        }

        if (matrices.length && (activeConcept === "__all")) {
          var gt = document.createElement("h2");
          gt.className = "group-title";
          gt.textContent = "Matrices";
          content.appendChild(gt);
          matrices.forEach(function (mx) { content.appendChild(renderMatrix(mx)); });
        }

        applyHash();
      }

      function matchesQuery(el, q) {
        if (!q) return true;
        if ((el.name || "").toLowerCase().indexOf(q) >= 0) return true;
        if ((el.description || "").toLowerCase().indexOf(q) >= 0) return true;
        var f = el.fields || {};
        return Object.keys(f).some(function (k) {
          return (k + " " + f[k]).toLowerCase().indexOf(q) >= 0;
        });
      }

      function conceptColor(name) {
        var c = concepts.filter(function (x) { return x.name === name; })[0];
        return (c && COLORS[c.color]) || getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#1f2937";
      }

      function renderConceptSection(name, list) {
        var sec = document.createElement("section");
        sec.className = "concept";
        sec.id = "concept-" + slug(name);
        var col = conceptColor(name);
        var h = document.createElement("h2");
        h.innerHTML = '<span class="dot" style="background:' + col + '"></span>' + esc(name);
        sec.appendChild(h);
        var sub = document.createElement("p");
        sub.className = "concept-sub";
        sub.textContent = list.length + (list.length === 1 ? " element" : " elements");
        sec.appendChild(sub);
        list.forEach(function (el) { sec.appendChild(renderElement(el, col)); });
        return sec;
      }

      function renderElement(el, col) {
        var wrap = document.createElement("div");
        wrap.className = "element";
        wrap.id = "el-" + (el.id || slug(el.name || "x"));

        var head = document.createElement("div");
        head.className = "el-head";
        head.innerHTML = '<span class="el-name">' + esc(el.name || "(unnamed)") + '</span>';
        var markers = el.markers || {};
        Object.keys(markers).forEach(function (m) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.innerHTML = esc(m) + " <b>" + esc(String(markers[m])) + "</b>";
          head.appendChild(chip);
        });
        var chev = document.createElement("span");
        chev.className = "chevron";
        chev.textContent = "▸";
        head.appendChild(chev);
        head.addEventListener("click", function () { wrap.classList.toggle("open"); });
        wrap.appendChild(head);

        var body = document.createElement("div");
        body.className = "el-body";
        if (el.description) {
          var p = document.createElement("p");
          p.className = "desc";
          p.textContent = el.description;
          body.appendChild(p);
        }
        var fields = el.fields || {};
        var fkeys = Object.keys(fields);
        if (fkeys.length) {
          var t = document.createElement("table");
          t.className = "fields";
          fkeys.forEach(function (k) {
            var tr = document.createElement("tr");
            tr.innerHTML = "<td>" + esc(k) + "</td><td>" + esc(String(fields[k])) + "</td>";
            t.appendChild(tr);
          });
          body.appendChild(t);
        }
        var rels = Array.isArray(el.relations) ? el.relations : [];
        if (rels.length) {
          var ul = document.createElement("ul");
          ul.className = "rel-list";
          rels.forEach(function (r) {
            var li = document.createElement("li");
            var label = esc(r.targetLabel || r.target || "?");
            var linked = r.target && byId[r.target]
              ? '<a href="#el-' + esc(r.target) + '">' + label + "</a>"
              : label;
            li.innerHTML = '<span class="rel-field">' + esc(r.field || "related") + "</span> → " + linked;
            ul.appendChild(li);
          });
          body.appendChild(ul);
        }
        if (!el.description && !fkeys.length && !rels.length) {
          body.innerHTML = '<p class="desc" style="color:var(--muted)">No fields, markers, or relationships.</p>';
        }
        wrap.appendChild(body);
        return wrap;
      }

      function renderMatrix(mx) {
        var block = document.createElement("div");
        block.className = "matrix-block";
        var h = document.createElement("h3");
        h.textContent = mx.name || "Matrix";
        block.appendChild(h);
        var scroll = document.createElement("div");
        scroll.className = "matrix-scroll";
        var rows = mx.rows || [], cols = mx.cols || [], cells = mx.cells || {};
        var html = "<table class='matrix'><thead><tr><th></th>";
        cols.forEach(function (c) { html += "<th>" + esc(c) + "</th>"; });
        html += "</tr></thead><tbody>";
        rows.forEach(function (r) {
          html += "<tr><th>" + esc(r) + "</th>";
          cols.forEach(function (c) {
            var v = (cells[r] && cells[r][c] != null) ? cells[r][c] : "";
            html += "<td>" + esc(String(v)) + "</td>";
          });
          html += "</tr>";
        });
        html += "</tbody></table>";
        scroll.innerHTML = html;
        block.appendChild(scroll);
        return block;
      }

      function applyHash() {
        var h = location.hash;
        if (!h || h.length < 2) return;
        var target = document.getElementById(h.slice(1));
        if (target && target.classList.contains("element")) {
          target.classList.add("open");
          target.scrollIntoView({ behavior: "smooth", block: "center" });
        }
      }
      window.addEventListener("hashchange", function () {
        // ensure the concept holding the target is visible
        var id = location.hash.slice(1);
        var el = byId[id.replace(/^el-/, "")];
        if (el && activeConcept !== "__all" && activeConcept !== el.concept) {
          selectConcept("__all");
        } else {
          applyHash();
        }
      });

      selectConcept("__all");

      // ---- helpers ----
      function esc(s) {
        return String(s == null ? "" : s)
          .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }
      function slug(s) {
        return String(s || "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
      }
    })();
  </script>
</body>
</html>
