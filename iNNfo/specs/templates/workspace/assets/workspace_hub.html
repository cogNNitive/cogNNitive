<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace Console Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#3b82f6',
              50: '#eff6ff',
              100: '#dbeafe',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap');
    body { font-family: 'Inter', system-ui, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="h-full flex flex-col antialiased selection:bg-blue-500 selection:text-white">
  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-20 px-6 py-4 glass">
    <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600/20 border border-blue-500/30 flex items-center justify-center text-blue-400 font-mono font-bold text-lg shadow-inner">
          NN
        </div>
        <div>
          <div class="flex items-center gap-2">
            <h1 id="workspace-title" class="text-lg font-bold tracking-tight text-white">Workspace Console Hub</h1>
            <span id="workspace-version" class="px-2 py-0.5 text-2xs font-mono font-medium rounded-full bg-slate-800 text-slate-400 border border-slate-700">v1.0.0</span>
          </div>
          <p id="workspace-subtitle" class="text-xs text-slate-400">Aggregated portal for all domain models and interactive consoles</p>
        </div>
      </div>

      <!-- Search & Filters -->
      <div class="flex items-center gap-3">
        <div class="relative">
          <input 
            type="text" 
            id="search-input" 
            placeholder="Filter models or templates..." 
            class="w-64 px-3 py-1.5 pl-9 text-xs rounded-lg bg-slate-900 border border-slate-700 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all"
          >
          <svg class="w-4 h-4 text-slate-500 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
        </div>
        <div id="stats-badge" class="px-3 py-1 text-xs font-semibold rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/20">
          <span id="active-count">0</span> Active Consoles
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content Layout -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 flex flex-col gap-6">
    <!-- Active Embedded Viewer (Hidden by default, shown when a console is launched in-hub) -->
    <div id="preview-panel" class="hidden flex-col bg-slate-950 rounded-xl border border-slate-800 overflow-hidden shadow-2xl transition-all duration-300">
      <div class="flex items-center justify-between px-4 py-2.5 bg-slate-900 border-b border-slate-800">
        <div class="flex items-center gap-2">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="preview-title" class="text-xs font-semibold text-slate-200">Embedded Console Preview</span>
        </div>
        <div class="flex items-center gap-2">
          <a id="preview-ext-link" href="#" target="_blank" class="px-2.5 py-1 text-xs rounded bg-slate-800 hover:bg-slate-700 text-slate-300 transition-colors flex items-center gap-1.5">
            <span>Open in new tab</span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
          </a>
          <button id="preview-close-btn" class="p-1 rounded hover:bg-slate-800 text-slate-400 hover:text-white transition-colors" title="Close Preview">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
          </button>
        </div>
      </div>
      <iframe id="preview-frame" src="about:blank" class="w-full h-[650px] border-none bg-slate-950"></iframe>
    </div>

    <!-- Models Grid -->
    <div>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Available Workspace Consoles & Domain Models</h2>
        <span class="text-xs text-slate-500" id="models-count-label">Showing 0 models</span>
      </div>
      <div id="models-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
        <!-- Dynamic Cards Injected Here -->
      </div>
    </div>
  </main>

  <!-- Workspace Data Injection Slot -->
  <script id="innfo-workspace-data" type="application/json">
  {
    "workspace": {
      "title": "iNNfo Workspace Hub",
      "version": "1.0.0",
      "description": "Unified entry point for all workspace models and interactive consoles"
    },
    "models": [
      {
        "id": "business-model",
        "title": "Business Strategic Model",
        "version": "1.0.0",
        "template": "business",
        "description": "Customer segments, value propositions, market forces, unit economics, and strategic roadmaps.",
        "modelPath": "models/Business_V_1-0-0_business_NN.md",
        "consolePath": "artifacts/business_console.html",
        "hasConsole": true
      },
      {
        "id": "procedures-model",
        "title": "Operations & SOP Execution",
        "version": "1.0.0",
        "template": "procedures",
        "description": "Step-by-step Standard Operating Procedures, stage-gates, and executable workflow pipelines.",
        "modelPath": "models/Operations_V_1-0-0_procedures_NN.md",
        "consolePath": "artifacts/procedures_console.html",
        "hasConsole": true
      },
      {
        "id": "organization-model",
        "title": "Organization & Capability Matrix",
        "version": "1.0.0",
        "template": "organization",
        "description": "Team topology, role responsibilities, reporting hierarchies, and skills coverage matrix.",
        "modelPath": "models/Organization_V_1-0-0_organization_NN.md",
        "consolePath": "artifacts/organization_console.html",
        "hasConsole": false
      }
    ]
  }
  </script>

  <!-- Runtime Logic -->
  <script>
    (function () {
      const dataEl = document.getElementById('innfo-workspace-data');
      let data = { workspace: {}, models: [] };
      if (dataEl) {
        try {
          data = JSON.parse(dataEl.textContent || '{}');
        } catch (e) {
          console.error('Failed to parse workspace data slot', e);
        }
      }

      // Populate metadata
      if (data.workspace?.title) document.getElementById('workspace-title').textContent = data.workspace.title;
      if (data.workspace?.version) document.getElementById('workspace-version').textContent = `v${data.workspace.version}`;
      if (data.workspace?.description) document.getElementById('workspace-subtitle').textContent = data.workspace.description;

      const grid = document.getElementById('models-grid');
      const searchInput = document.getElementById('search-input');
      const activeCountEl = document.getElementById('active-count');
      const modelsCountLabel = document.getElementById('models-count-label');
      const previewPanel = document.getElementById('preview-panel');
      const previewFrame = document.getElementById('preview-frame');
      const previewTitle = document.getElementById('preview-title');
      const previewExtLink = document.getElementById('preview-ext-link');
      const previewCloseBtn = document.getElementById('preview-close-btn');

      const templateColors = {
        business: { bg: 'bg-emerald-500/10', text: 'text-emerald-400', border: 'border-emerald-500/20', icon: '🏢' },
        procedures: { bg: 'bg-indigo-500/10', text: 'text-indigo-400', border: 'border-indigo-500/20', icon: '📋' },
        organization: { bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/20', icon: '👥' },
        site: { bg: 'bg-cyan-500/10', text: 'text-cyan-400', border: 'border-cyan-500/20', icon: '🌐' },
        default: { bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/20', icon: '📦' },
      };

      function renderGrid(filter = '') {
        const query = filter.toLowerCase().trim();
        const filtered = (data.models || []).filter(m => 
          !query || 
          m.title.toLowerCase().includes(query) || 
          m.template.toLowerCase().includes(query) || 
          (m.description && m.description.toLowerCase().includes(query))
        );

        const activeConsoles = (data.models || []).filter(m => m.hasConsole).length;
        activeCountEl.textContent = activeConsoles;
        modelsCountLabel.textContent = `Showing ${filtered.length} of ${data.models?.length || 0} models`;

        grid.innerHTML = '';
        if (filtered.length === 0) {
          grid.innerHTML = `
            <div class="col-span-full py-12 text-center text-slate-500">
              <p class="text-sm">No models or consoles matching "${filter}".</p>
            </div>
          `;
          return;
        }

        filtered.forEach(model => {
          const style = templateColors[model.template] || templateColors.default;
          const card = document.createElement('div');
          card.className = "bg-slate-900/90 rounded-xl border border-slate-800 p-5 flex flex-col justify-between hover:border-slate-700 transition-all hover:shadow-lg group";

          card.innerHTML = `
            <div>
              <div class="flex items-center justify-between gap-2 mb-3">
                <span class="px-2.5 py-1 text-2xs font-semibold uppercase tracking-wider rounded-md border ${style.bg} ${style.text} ${style.border} flex items-center gap-1.5">
                  <span>${style.icon}</span>
                  <span>${model.template}</span>
                </span>
                <span class="text-2xs font-mono text-slate-500">v${model.version || '1.0.0'}</span>
              </div>
              <h3 class="text-base font-bold text-white group-hover:text-blue-400 transition-colors mb-2">${model.title}</h3>
              <p class="text-xs text-slate-400 leading-relaxed mb-4">${model.description || 'No description provided.'}</p>
            </div>

            <div class="pt-4 border-t border-slate-800/80 flex items-center justify-between gap-2">
              <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full ${model.hasConsole ? 'bg-emerald-500' : 'bg-slate-600'}"></span>
                <span class="text-2xs font-medium ${model.hasConsole ? 'text-emerald-400' : 'text-slate-500'}">
                  ${model.hasConsole ? 'Console Ready' : 'Pending Build'}
                </span>
              </div>
              <div class="flex items-center gap-2">
                ${model.hasConsole ? `
                  <button data-launch="${model.consolePath}" data-title="${model.title}" class="launch-btn px-3 py-1.5 text-xs font-semibold rounded-lg bg-blue-600 hover:bg-blue-500 text-white shadow-sm transition-all cursor-pointer flex items-center gap-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <span>Launch</span>
                  </button>
                ` : `
                  <span class="text-2xs text-slate-500 italic">Run procedure to build</span>
                `}
              </div>
            </div>
          `;
          grid.appendChild(card);
        });

        // Attach launch handlers
        grid.querySelectorAll('.launch-btn').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const path = btn.getAttribute('data-launch');
            const title = btn.getAttribute('data-title');
            launchConsole(path, title);
          });
        });
      }

      function launchConsole(path, title) {
        previewFrame.src = path;
        previewTitle.textContent = `${title} (Console Preview)`;
        previewExtLink.href = path;
        previewPanel.classList.remove('hidden');
        previewPanel.classList.add('flex');
        previewPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }

      previewCloseBtn.addEventListener('click', () => {
        previewFrame.src = 'about:blank';
        previewPanel.classList.add('hidden');
        previewPanel.classList.remove('flex');
      });

      searchInput.addEventListener('input', (e) => {
        renderGrid(e.target.value);
      });

      // Initial render
      renderGrid();
    })();
  </script>
</body>
</html>
