<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iNNfo Console</title>
    <!--
    artifact_blueprint.html — thin console shell for innfo-console artifacts.

    Generating agents MUST only:
      1. Declare capabilities in the innfo-config needs[] list below
         (pins resolve via needs-registry.json — never hand-edit URLs).
      2. Paste the Schema JSON Contract into #innfo-schema.
      3. Paste the Model JSON Contract into #innfo-model.
    Nothing else in this file is edited. The shared runtime
    (innfo-runtime.js, window.InnfoConsole) renders banner, rail, search,
    cards, matrices, drafts, and the export modal. Do NOT inline runtime
    code here — the no-inline-runtime scan rejects it.

    Runtime loading (static script tags only — file:// compatible, no modules,
    no network fetch calls):
      - Primary: jsDelivr pin @innfo-console-0.1.0 (tag cut at release;
        pre-tag dev uses @main with the SRI hash recorded by the release).
      - Fallback: raw.githubusercontent mirror, then the vendored copy
        shipped next to the generated console for offline double-click.
      The runtime no-ops on re-execution, so the fallback tags below are
      safe: exactly one copy boots.
  -->
    <style>
      :root {
        --bg: #f9fafb;
        --surface: #ffffff;
        --text: #111827;
        --muted: #6b7280;
        --border: #e5e7eb;
        --accent: #1f2937;
        --link: #2563eb;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family:
          'Inter',
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          Roboto,
          sans-serif;
        line-height: 1.55;
      }
      #innfo-banner {
        padding: 16px 24px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        gap: 12px;
        align-items: baseline;
      }
      #innfo-banner .innfo-banner-version,
      #innfo-banner .innfo-banner-needs,
      #innfo-banner .innfo-banner-drafts {
        color: var(--muted);
        font-size: 0.8rem;
      }
      #innfo-layout {
        display: grid;
        grid-template-columns: 240px 1fr;
        gap: 0;
      }
      #innfo-rail {
        border-right: 1px solid var(--border);
        background: var(--surface);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .innfo-rail-item {
        text-align: left;
        background: none;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 8px 10px;
        cursor: pointer;
        font-size: 0.85rem;
      }
      .innfo-rail-item:hover {
        background: var(--bg);
      }
      main {
        padding: 20px 24px;
      }
      #innfo-search {
        width: 100%;
        max-width: 480px;
        padding: 8px 12px;
        font-size: 0.9rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        margin-bottom: 16px;
      }
      .innfo-card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 12px;
        scroll-margin-top: 12px;
      }
      .innfo-card h3 {
        margin: 0 0 4px 0;
      }
      .innfo-card-concept {
        color: var(--muted);
        font-size: 0.8rem;
        margin: 0 0 8px 0;
      }
      .innfo-card-fields {
        display: grid;
        grid-template-columns: 160px 1fr;
        gap: 4px 12px;
        font-size: 0.85rem;
      }
      .innfo-card-fields dt {
        color: var(--muted);
      }
      .innfo-card-fields dd {
        margin: 0;
      }
      .innfo-matrix {
        margin: 24px 0;
      }
      .innfo-matrix table {
        border-collapse: collapse;
        font-size: 0.85rem;
      }
      .innfo-matrix th,
      .innfo-matrix td {
        border: 1px solid var(--border);
        padding: 6px 10px;
        text-align: left;
      }
      #innfo-export-modal {
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 20px;
        max-width: 560px;
      }
      #innfo-export-modal input {
        width: 100%;
        padding: 8px 12px;
        margin: 8px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      #innfo-export-modal pre {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 12px;
        white-space: pre-wrap;
        font-size: 0.8rem;
      }
    </style>
  </head>
  <body>
    <header id="innfo-banner" aria-label="Console review banner"></header>

    <div id="innfo-layout">
      <nav id="innfo-rail" aria-label="Concept rail"></nav>
      <main>
        <input
          id="innfo-search"
          type="search"
          placeholder="Search elements…"
          aria-label="Search elements"
        />
        <button id="innfo-export-open" type="button">Export feedback</button>
        <div id="innfo-content"></div>
        <div id="innfo-matrices"></div>
      </main>
    </div>

    <dialog id="innfo-export-modal" aria-label="Export reviewer feedback">
      <h2>Export reviewer feedback</h2>
      <label
        >Reviewer identifier (required)
        <input data-innfo="identifier" type="text" placeholder="e.g. round-2" />
      </label>
      <h3>Instructions</h3>
      <pre data-innfo="instructions"></pre>
      <h3>Agent prompt</h3>
      <pre data-innfo="agent-prompt"></pre>
      <button data-innfo="download" type="button">Download feedback JSON</button>
    </dialog>

    <script type="application/json" id="innfo-config">
      {
        "needs": [
          "concept-rail",
          "fulltext-search",
          "matrix-grids",
          "hash-routing",
          "feedback-export"
        ],
        "runtime": {
          "cdn": "https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-0.1.0/iNNfo/specs/templates/console/innfo-runtime.js",
          "fallback": "https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-runtime.js"
        }
      }
    </script>
    <script type="application/json" id="innfo-schema">
      {}
    </script>
    <script type="application/json" id="innfo-model">
      {}
    </script>

    <script src="https://cdn.jsdelivr.net/gh/cogNNitive/cogNNitive@innfo-console-0.1.0/iNNfo/specs/templates/console/innfo-runtime.js"></script>
    <script src="https://raw.githubusercontent.com/cogNNitive/cogNNitive/main/iNNfo/specs/templates/console/innfo-runtime.js"></script>
    <script src="./innfo-runtime.js"></script>
  </body>
</html>
