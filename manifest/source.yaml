version: "2.0"
entrypoint: "workspace_NN.md"

skills:
  - name: nn-router
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-router
    version: "V_3-3-0"
    ref_key: skills
    description: Central system governance, setup, environment readiness gate (Preflight), and skill router.
  - name: nn-trannsform
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-trannsform
    version: "V_3-1-0"
    ref_key: skills
    requires: [nn-innfo, nn-preflight]
    description: Ingest documents (PDF, DOCX, XLSX), transform using templates, and execute multi-step procedures (procedures_V_0-1-0_NN.md).
  - name: nn-innfo
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-innfo
    version: "V_0-3-0"
    ref_key: skills
    description: Author, edit, and validate iNNfo models with built-in step-by-step Model Creation Wizard.
    templates: [workspace_spec_NN]
    mcp:
      - name: innfo-mcp
        repo: cogNNitive/cogNNitive
        path: iNNfo/packages/innfo-mcp/bin/innfo-mcp.bundle.js
        version: "0.5.0"
        ref_key: innfo-mcp
  - name: nn-preflight
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-preflight
    version: "V_0-2-0"
    ref_key: skills
    description: Environment readiness gate (Tier 1/Tier 2/Tier 3) and canonical skill-location reference.
  - name: nn-upgrade
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-upgrade
    version: "V_0-1-0"
    ref_key: skills
    requires: [nn-preflight]
    description: Guided, consent-gated migration of a workspace to the latest adopted iNNfo Level-2 templates.
  - name: nn-site-generator
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-site-generator
    version: "V_0-2-0"
    ref_key: skills
    description: Create or edit websites, add analytics, add contact forms.
  - name: nn-design-presets
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-design-presets
    version: "V_1-2-0"
    ref_key: skills
    description: cogNNitive visual design presets — palettes, typography, spacing.
  - name: nn-skills-lifecycle
    repo: cogNNitive/cogNNitive
    path: actioNN/skills/nn-skills-lifecycle
    version: "V_1-2-0"
    ref_key: skills
    requires: [nn-preflight]
    description: Audit, update, and maintain cogNNitive skills.

templates:
  - name: workspace
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/workspace_spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: projects
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/projects/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: procedures
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/procedures/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: organization
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/organization/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: business
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/business/spec_NN.md
    version: "V_0-2-3"
    ref_key: templates
  - name: business-model
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/business-model/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: analysis
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/analysis/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: innovation
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/innovation/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: blank
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/blank/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: documentation
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/documentation/spec_NN.md
    version: "V_0-2-0"
    ref_key: templates
  - name: metrics
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/metrics/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates

# Retired templates kept byte-identical on disk for legacy resolution. They are
# NOT part of ACTIVE distribution: the catalog drops them from `templates` and
# records them under a top-level `frozen` object; this partition keeps the
# verify.js template inventory guard satisfied while the folders stay on disk.
frozen_templates:
  - name: cogNNitive
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/cogNNitive/spec_NN.md
    version: "V_0-2-1"
    ref_key: templates
  - name: base
    repo: cogNNitive/cogNNitive
    path: iNNfo/specs/templates/base/spec_NN.md
    version: "V_0-1-0"
    ref_key: templates

workflows:
  - id: model
    label: Create an iNNfo model
    description: Turn an idea, document, or dataset into a validated structured model.
    skill: nn-innfo
    template: workspace_spec_NN
  - id: transform
    label: Transform a document
    description: Normalize a PDF/DOCX/XLSX into clean Markdown, or export to HTML.
    skill: nn-trannsform
  - id: pdf-to-innfo-dashboard
    label: PDF to iNNfo dashboard
    description: Normalize a PDF, model it with iNNfo, and export an interactive deliverable.
    skill: nn-trannsform

# `refs` is a list of { key, repo, ref }: the tag/branch that channel resolves
# to a commit for a given ref_key. ref_key defaults to an entry's own `repo`;
# entries that share a repo with a different release cadence (e.g. innfo-mcp
# vs. templates) declare an explicit `ref_key` and
# get their own row here, with `repo` restated so the generator can catch a
# mismatched key. (A list, not a map, because the focused YAML parser used by
# these zero-dependency scripts does not support `/` inside a mapping key.)
channels:
  stable:
    refs:
      - key: skills
        repo: cogNNitive/cogNNitive
        ref: skills-v1.3.0
      - key: templates
        repo: cogNNitive/cogNNitive
        ref: templates-v0.3.1
      - key: innfo-mcp
        repo: cogNNitive/cogNNitive
        ref: innfo-mcp-v0.5.0
  preview:
    refs:
      - key: skills
        repo: cogNNitive/cogNNitive
        ref: main
      - key: templates
        repo: cogNNitive/cogNNitive
        ref: main
      - key: innfo-mcp
        repo: cogNNitive/cogNNitive
        ref: main
