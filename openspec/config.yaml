schema: spec-driven
strict_tdd: true

context: |
  Project: cogNNitive
  Type: Multi-module ecosystem containing agent skills, documentation, and the iNNfo monorepo.
  Modules:
    - iNNfo: Monorepo with npm workspaces (innfo-core, innfo-mcp). The Vue 3 editor (apps/innfo-editor) is FROZEN: not a workspace, not gated; its hosted app is a committed static build. Stack: TypeScript, ESM.
    - actioNN: Agent skill ecosystem (Markdown + YAML frontmatter, Node.js scripts for nn-sources).
    - eNNvironment: Ecosystem setup, manifest governance, and validation scripts.
    - _NN: Artifacts and commercial web content store.
    - Simulacro: Mock and sample workspace environment.

testing:
  strict_tdd: true
  detected_at: '2026-10-01'
  runner:
    command: 'npm test'
    framework: 'Vitest (iNNfo workspaces) / Node scripts (scripts/, skills/, test/)'
    per_package:
      innfo-core: 'npm --workspace=@cognnitive/innfo-core test'
      innfo-mcp: 'npm --workspace=@cognnitive/innfo-mcp test'
      scripts_and_skills: 'node scripts/verify.js (discovers every *.test.js/*.test.mjs under scripts/, skills/, test/ via collectTestSuites)'
      nn-sources: 'npm --prefix skills/nn-sources test (own package.json; CI needs npm ci --prefix)'
  layers:
    unit:
      available: true
      tool: 'Vitest (iNNfo) / plain node *.test.js|mjs suites (scripts, skills, test)'
    integration:
      available: true
      tool: 'Vitest (iNNfo) / PowerShell scripts in skills/nn-sources/test (pwsh)'
    e2e:
      available: false
      note: 'Playwright suite removed 2026-09-24; editor XSS guarantee covered by jsdom-pragma unit test (editor frozen 2026-10-14, no longer run)'
  coverage:
    available: true
    command: 'npm run test:coverage'
    note: 'core, mcp only'
  quality:
    linter:
      available: true
      command: 'npm run lint'
      fix_command: 'npm run lint:fix'
    typecheck:
      available: true
      command: 'npm run typecheck'
      extra: 'npm run typecheck:scripts'
    formatter:
      available: true
      command: 'npm run format:check'
      fix_command: 'npm run format'
      # INFORMATIONAL - legacy gate. Many pre-existing prettier-dirty files;
      # CI only checks formatting of files changed in a PR. Ensure a change
      # introduces zero NEW drift; do not report the baseline.
  gates:
    deterministic: 'node scripts/verify.js [--release]'
    integrity: 'npm run check:integrity'
    node_engine: '^22.22.2 || ^24.15.0 || >=26 (engine-strict=true in .npmrc)'

rules:
  proposal:
    - Describe the problem clearly across the affected cogNNitive ecosystem modules.
    - Reference specific skills in actioNN, packages in iNNfo, or specifications affected.
  specs:
    - Use Given/When/Then for behavioral scenarios where applicable.
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - Detail exact schema changes or skill triggers.
  design:
    - Document data structures, API/MCP contracts, and skill frontmatter diffs.
    - Specify architecture seams, imports/exports, and package boundaries.
  tasks:
    - Group tasks by component/module with strict dependency ordering.
    - Include TDD test-first steps before implementation tasks.
    - Include lint, typecheck, format, and test verification tasks at each step.
