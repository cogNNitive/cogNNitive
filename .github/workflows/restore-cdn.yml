name: Restore CDN Bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    environment: release
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore CDN Bundles
        env:
          WEB_RELEASE_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN }}
        run: node -e "require('./scripts/release/restore-cdn-bundles.js').restoreCdnBundles()"
