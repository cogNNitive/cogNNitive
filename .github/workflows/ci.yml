name: CI & Verify

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # ── Workspace-level deterministic checks (template inventory, script
  #    typecheck, manifest validity, docs build gate).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix iNNfo ci

      # Build first: `verify.js` step 0 (MCP Version Square) reads the staged CDN
      # bundle `docs/innfo/cdn/innfo-mcp-v<version>.bundle.js`, which is a
      # gitignored build artifact created here — a fresh checkout has none.
      - name: Build Docs & Bundles Gate
        run: npm run build:docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Deterministic Verification
        run: "node scripts/verify.js ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && '--release' || '' }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Hand the built docs to deploy-pages so Pages publishes exactly what this
      # job verified instead of rebuilding. Only produced on main (the only ref
      # deploy-pages runs on).
      - name: Upload built docs (Pages artifact)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs
          path: docs
          retention-days: 1

  # ── iNNfo quality gate: lint, typecheck, unit tests, app build. Previously
  #    lived in iNNfo/.github/workflows/ci.yml, which GitHub Actions never ran
  #    (only the repo-root .github/workflows/ is executed).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix iNNfo ci

      - name: Build core package
        run: npm --prefix iNNfo/packages/innfo-core run build

      - name: Lint
        run: npm --prefix iNNfo run lint

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        working-directory: iNNfo
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' '*.mts' '*.vue' '*.js' '*.mjs' '*.json' | sed -n 's#^iNNfo/##p' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then
            npx prettier --check --ignore-unknown $CHANGED
          else
            echo "No formattable iNNfo files changed."
          fi

      - name: Typecheck (app)
        run: npm --prefix iNNfo/apps/innfo-editor run typecheck

      - name: Typecheck (innfo-mcp)
        run: npm --prefix iNNfo/packages/innfo-mcp run typecheck

      - name: Unit tests (core)
        run: npm --prefix iNNfo/packages/innfo-core test

      - name: Unit tests + coverage (innfo-mcp)
        run: npm --prefix iNNfo/packages/innfo-mcp run test:coverage

      - name: Unit tests (app)
        run: npm --prefix iNNfo/apps/innfo-editor test

      - name: Build app
        run: npm --prefix iNNfo/apps/innfo-editor run build

  # ── Every hardcoded raw.githubusercontent.com spec URL must resolve to a
  #    file that exists; specs/ is immutable and filename-encoded.
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm --prefix iNNfo ci

      - name: Check spec URLs resolve
        run: npm --prefix iNNfo run check:spec-urls

      - name: Spec version inventory (informational)
        run: npm --prefix iNNfo run check:spec-version -- --inventory

  deploy-pages:
    needs: [verify, quality, spec-integrity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Serialize only the Pages deployment — not the test jobs above, which
    # must run to completion on every push.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Publish exactly what `verify` built and validated — no npm ci, no rebuild.
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: pages-docs
          path: docs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
