name: CI & Verify

on:
  push:
    # `main` is the integration branch and every green push releases (auto-tag below).
    # `dev` stays only until the branches still based on it have landed. Session
    # branches are gated by their PR, so a push to them does not run CI twice.
    branches: [ main, dev ]
  # No base filter: every PR runs the gate, whatever branch it targets.
  pull_request:
  # Dormant: there is no merge queue today, so GitHub never creates a `merge_group`
  # event. The trigger stays because a queue is enabled by a ruleset change and not by a
  # PR, and it needs this: the queue validates `main` plus every PR ahead of it on a
  # temporary `gh-readonly-queue/<base>/...` ref, and GitHub only waits for checks
  # reported against that ref. Enabling a queue without this trigger blocks every merge
  # forever. On a merge group the full gate runs, never the `refs/heads/session/**` tier.
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch/PR supersedes the running one. main and tags
# are never cancelled: every main commit keeps its full gate and publish run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  # ── Workspace-level deterministic checks (template inventory, script
  #    typecheck, drift guards, test suites). Offline.
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives this job full history, which the local-history
      # guards (template immutability) read. Local only; no remote lookups.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The nn-sources skill ships its own dependency tree (minimist, prompts,
      # document converters) outside the root workspaces, so `npm ci` above does
      # not install it. `verify.js` step 5b spawns that skill's CLI, which exits 1
      # on a fresh checkout without these deps.
      - name: Install nn-sources skill dependencies
        run: npm ci --prefix skills/nn-sources

      # Docs facts drift check in verify.js imports nn-mcp's built dist/server.js
      # to inspect MCP tool definitions. `build:dist`, never `build`: a plain
      # `tsup` also rewrites the committed `bin/nn-mcp.bundle.js`, so the drift
      # check inside verify.js compared a fresh bundle against the one this step
      # had just regenerated, and could never report a stale artifact.
      - name: Build MCP packages for facts check
        run: npm --workspace=@cognnitive/nn-core run build && npm --workspace=@cognnitive/nn-mcp run build:dist

      # Offline and deterministic: no network, no release tags, no token. Each
      # step logs to .verify-logs/; a failing step's tail is shown in a log group.
      # session/** pushes get the fast tier (all guards, drift checks and quick suites;
      # see SLOW_SUITES in verify.js). dev, main, PRs and releases run the full gate.
      - name: Run Deterministic Verification
        run: node scripts/verify.js ${{ startsWith(github.ref, 'refs/heads/session/') && github.event_name == 'push' && '--fast' || '' }}

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: .verify-logs
          include-hidden-files: true
          retention-days: 7

  # ── Site build: docs + the MCP CDN bundle, handed to publish-web. Separate
  #    from `verify` so the offline gate never depends on the docs build.
  site:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives full history + all tags, required by
      # `scripts/freshness.js` (`git rev-list --count <tag>..HEAD -- <path>`).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Docs
        run: npm run build:docs

      # Per-subsystem channel drift (how far main has moved past each
      # subsystem's pinned stable tag), local history only. Never blocking:
      # a measurement failure must not redden main or block the Pages
      # deploy — that would be worse than the silence it replaces.
      - name: Compute channel freshness
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/freshness.js

      # Hand the built docs to publish-web so the public distribution repo
      # publishes exactly what this job built instead of rebuilding. Only
      # produced on main (the only ref publish-web runs on).
      - name: Upload built docs (publish artifact)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: pages-docs
          path: docs
          retention-days: 1

  # ── iNNfo quality gate: lint, typecheck, unit tests. Previously
  #    lived in iNNfo/.github/workflows/ci.yml, which GitHub Actions never ran
  #    (only the repo-root .github/workflows/ is executed).
  quality:
    runs-on: ubuntu-latest
    steps:
      # Full history. The format check diffs against the PR's base branch, and a
      # shallow clone has no merge base with it, so `git diff base...HEAD` fails;
      # that failure used to be swallowed and reported as "nothing changed".
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The nn-mcp suite now spawns the nn-sources skill CLI (the domain
      # synchronization e2e test), which ships its own dependency tree
      # (minimist, prompts, document converters) outside the root workspaces.
      - name: Install nn-sources skill dependencies
        run: npm ci --prefix skills/nn-sources

      - name: Build core package
        run: npm --workspace=@cognnitive/nn-core run build

      - name: Lint
        run: npm run lint

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Capture the diff status before parsing its output: mapfile with process
          # substitution would turn a failed diff into an apparently empty PR.
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          npx prettier --version >/dev/null   # a missing prettier must not read as "all clean"

          changed=$(git diff --name-only --diff-filter=ACMR "origin/$BASE_REF...HEAD" \
            -- '*.ts' '*.mts' '*.vue' '*.js' '*.mjs' '*.json')
          if [[ -z "$changed" ]]; then
            echo "No formattable files changed."
            exit 0
          fi
          mapfile -t CHANGED <<< "$changed"

          # The repo is not prettier-formatted, and this gate only started running when
          # #735 stopped swallowing its failures. Checking every touched file at once
          # therefore failed PRs for debt that was already on the base branch — four open
          # PRs at once. The gate now stops NEW debt: a file is checked when it was
          # already conformant on the base branch, or when the PR adds it. A file that
          # was unformatted before is named and skipped; paying that debt is one
          # repo-wide `prettier --write` PR, not a tax on every unrelated change.
          must=()
          debt=()
          for f in "${CHANGED[@]}"; do
            if git cat-file -e "origin/$BASE_REF:$f" 2>/dev/null; then
              if git show "origin/$BASE_REF:$f" | npx prettier --stdin-filepath "$f" 2>/dev/null \
                | diff -q - <(git show "origin/$BASE_REF:$f") >/dev/null 2>&1; then
                must+=("$f")
              else
                debt+=("$f")
              fi
            else
              must+=("$f")   # a file the PR adds must arrive formatted
            fi
          done

          if [ ${#debt[@]} -gt 0 ]; then
            printf 'pre-existing formatting debt on %s (not this PR): %s\n' "$BASE_REF" "${debt[*]}"
          fi
          if [ ${#must[@]} -eq 0 ]; then
            echo "Every changed file was already unformatted on $BASE_REF."
            exit 0
          fi
          npx prettier --check --ignore-unknown "${must[@]}"

      - name: Typecheck (nn-mcp)
        run: npm --workspace=@cognnitive/nn-mcp run typecheck

      - name: Unit tests + coverage (core)
        run: npm --workspace=@cognnitive/nn-core run test:coverage

      - name: Unit tests + coverage (nn-mcp)
        run: npm --workspace=@cognnitive/nn-mcp run test:coverage

  # ── Every hardcoded raw.githubusercontent.com spec URL must resolve to a
  #    file that exists; specs/ is immutable and filename-encoded.
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      # check-spec-version.mjs uses only node: built-ins and scripts/lib, so no npm ci.
      - name: Check spec URLs resolve
        run: npm run check:spec-urls

  # One-way publish of the built site to the public distribution repo
  # (`cogNNitive-web`), which owns the GitHub Pages deployment for
  # `cognnitive.com`. The monorepo no longer serves Pages from itself: this job
  # pushes the artifact `site` built (gated by `verify`), append-only and
  # idempotent (a byte-identical artifact is a no-op — no empty commit).
  publish-web:
    needs: [verify, site, quality, spec-integrity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "publish-web"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      # Publish exactly what `site` built (with `verify` green) — no npm ci, no rebuild.
      - name: Download built docs
        uses: actions/download-artifact@v8
        with:
          name: pages-docs
          path: docs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Publish to cogNNitive-web
        env:
          WEB_PUBLISH_TOKEN: ${{ secrets.WEB_PUBLISH_TOKEN }}
          INNFO_DOCS_OUT: ${{ github.workspace }}/docs
          WEB_PUBLISH_REPO: cogNNitive/cogNNitive-web
          WEB_PUBLISH_SUBDIR: docs
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/publish-web.mjs

  # ── Release = merge to main. After the gate is green, tag every release key that
  #    changed (scripts/release/plan-auto-tags.js decides key and version) and run the
  #    release workflow for each tag, one at a time, `blueprints` first. Tags pushed
  #    with GITHUB_TOKEN trigger no workflow, so release.yml is called directly here.
  #    The tags land in ONE atomic push (scripts/release/push-release-tags.mjs): a
  #    rejection therefore leaves every tag or none, never a half-tagged commit whose
  #    `release` job is skipped (#725).
  # ── Regeneration: derived artifacts belong to `main`, not to a change branch. A PR carries
  #    source only (the gate accepts the artifact that moves with it, `--tolerant`); this job
  #    commits the regenerated files and the derived version write-back here, BEFORE auto-tag
  #    plans, because the release publishes the tree of the tag it cuts. The commit carries a
  #    fixed message, and a run whose last commit already has it does nothing: the push below
  #    triggers that second run, and it must not regenerate again.
  regen:
    needs: [verify, quality, spec-integrity]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - run: npm ci

      - name: Regenerate and commit when a derived artifact or a version moved
        run: |
          set -euo pipefail
          GUARD='chore(regen): regenerate derived artifacts and write back the pending versions'
          if [ "$(git log -1 --format=%s)" = "$GUARD" ]; then
            echo "the last commit is already a regeneration: nothing to do"
            exit 0
          fi
          # The version is written back BEFORE the tag exists: version-agreement compares the
          # tag against package.json, and the release copies the tag's tree.
          node scripts/release/write-pending-versions.js
          npm run sync:versions
          npm run regen
          if [ -z "$(git status --porcelain)" ]; then
            echo "no derived artifact and no pending version moved"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "$GUARD"
          git push origin HEAD:main

  auto-tag:
    needs: [verify, site, quality, spec-integrity, regen]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tags: ${{ steps.plan.outputs.tags }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Plan release tags
        id: plan
        run: |
          set -euo pipefail
          # The regeneration commit is the tree that ships, so plan (and tag) THAT, not the
          # merge commit this run started on. `regen` has already pushed it by now.
          git fetch --no-tags origin main
          git checkout --detach FETCH_HEAD
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          node scripts/release/plan-auto-tags.js

      - name: Create and push tags
        env:
          TAGS: ${{ steps.plan.outputs.tags }}
          GITHUB_SHA: ${{ steps.plan.outputs.sha }}
        run: node scripts/release/push-release-tags.mjs

  release:
    needs: auto-tag
    if: needs.auto-tag.outputs.tags != '[]' && needs.auto-tag.outputs.tags != ''
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.auto-tag.outputs.tags) }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ matrix.tag }}
    secrets: inherit

  # UI smoke: Playwright (Chromium) over the committed TestLab console
  # artifacts via file://. Standalone job — never blocks verify/quality/site,
  # never gates publishing. Run locally with `npm run test:ui`.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The smoke reads test/ui and the TestLab export it opens, so skip the Playwright+Chromium
      # install unless those or the console source that produces the export changed. The export
      # no longer travels in a PR (the write-back lane commits it on `main`), so without the
      # console paths here a console change would never run the smoke at all.
      - name: Detect relevant changes
        id: rel
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -n "$BASE" ] && [ "$BASE" != 0000000000000000000000000000000000000000 ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE" "${{ github.sha }}" -- test/ui test/fixtures/testlab iNNfo/specs/bluepriNNts/console scripts/export-console.mjs .github/workflows/ci.yml; then
              echo run=false >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi
          echo run=true >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.rel.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        if: steps.rel.outputs.run == 'true'
        run: npm ci

      # Export the console from THIS tree, so the smoke opens the PR's bundle instead of the
      # one committed before the lane existed.
      - name: Export the TestLab console from source
        if: steps.rel.outputs.run == 'true'
        run: |
          npm --workspace=@cognnitive/nn-core run build
          node scripts/export-console.mjs test/fixtures/testlab --domain --no-open

      - name: Setup Python
        if: steps.rel.outputs.run == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        if: steps.rel.outputs.run == 'true'
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: UI smoke (TestLab console)
        if: steps.rel.outputs.run == 'true'
        run: npm run test:ui

      - name: Upload UI screenshots
        if: failure() && steps.rel.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ui-smoke-screenshots
          path: temp/ui-smoke
          retention-days: 7
