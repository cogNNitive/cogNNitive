name: CI & Verify

on:
  push:
    branches: [ main, dev, 'session/**' ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Workspace-level deterministic checks (template inventory, script
  #    typecheck, drift guards, test suites). Offline.
  verify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives this job full history, which the local-history
      # guards (template immutability) read. Local only; no remote lookups.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      # The nn-sources skill ships its own dependency tree (minimist, prompts,
      # document converters) outside the root workspaces, so `npm ci` above does
      # not install it. `verify.js` step 5b spawns that skill's CLI, which exits 1
      # on a fresh checkout without these deps.
      - name: Install nn-sources skill dependencies
        run: npm ci --prefix skills/nn-sources

      # Docs facts drift check in verify.js imports innfo-mcp's built dist/server.js
      # to inspect MCP tool definitions.
      - name: Build MCP packages for facts check
        run: npm --workspace=@cognnitive/innfo-core run build && npm --workspace=@cognnitive/innfo-mcp run build

      # Offline and deterministic: no network, no release tags, no token. Each
      # step logs to .verify-logs/; a failing step's tail is shown in a log group.
      - name: Run Deterministic Verification
        run: node scripts/verify.js

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verify-logs
          path: .verify-logs
          include-hidden-files: true
          retention-days: 7

  # ── Site build: docs + the MCP CDN bundle, handed to publish-web. Separate
  #    from `verify` so the offline gate never depends on the editor build.
  site:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 gives full history + all tags, required by
      # `scripts/freshness.js` (`git rev-list --count <tag>..HEAD -- <path>`).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Docs
        run: npm run build:docs

      # Per-subsystem channel drift (how far main has moved past each
      # subsystem's pinned stable tag), local history only. Never blocking:
      # a measurement failure must not redden main or block the Pages
      # deploy — that would be worse than the silence it replaces.
      - name: Compute channel freshness
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        run: node scripts/freshness.js

      # Hand the built docs to publish-web so the public distribution repo
      # publishes exactly what this job built instead of rebuilding. Only
      # produced on main (the only ref publish-web runs on).
      - name: Upload built docs (publish artifact)
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: pages-docs
          path: docs
          retention-days: 1

  # ── iNNfo quality gate: lint, typecheck, unit tests, app build. Previously
  #    lived in iNNfo/.github/workflows/ci.yml, which GitHub Actions never ran
  #    (only the repo-root .github/workflows/ is executed).
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build core package
        run: npm --workspace=@cognnitive/innfo-core run build

      - name: Lint
        run: npm run lint

      - name: Format check (changed files)
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin ${{ github.base_ref }}
          CHANGED=$(git diff --name-only --diff-filter=ACMR origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' '*.mts' '*.vue' '*.js' '*.mjs' '*.json' | tr '\n' ' ')
          if [ -n "$CHANGED" ]; then
            npx prettier --check --ignore-unknown $CHANGED
          else
            echo "No formattable files changed."
          fi

      - name: Typecheck (app)
        run: npm --workspace=@cognnitive/innfo-editor run typecheck

      - name: Typecheck (innfo-mcp)
        run: npm --workspace=@cognnitive/innfo-mcp run typecheck

      - name: Unit tests (core)
        run: npm --workspace=@cognnitive/innfo-core test

      - name: Unit tests + coverage (innfo-mcp)
        run: npm --workspace=@cognnitive/innfo-mcp run test:coverage

      - name: Unit tests (app)
        run: npm --workspace=@cognnitive/innfo-editor test

      - name: Build app
        run: npm --workspace=@cognnitive/innfo-editor run build

  # ── Every hardcoded raw.githubusercontent.com spec URL must resolve to a
  #    file that exists; specs/ is immutable and filename-encoded.
  spec-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Check spec URLs resolve
        run: npm run check:spec-urls

      - name: Spec version inventory (informational)
        run: npm run check:spec-version -- --inventory

  # One-way publish of the built site to the public distribution repo
  # (`cogNNitive-web`), which owns the GitHub Pages deployment for
  # `cognnitive.com`. The monorepo no longer serves Pages from itself: this job
  # pushes the artifact `site` built (gated by `verify`), append-only and
  # idempotent (a byte-identical artifact is a no-op — no empty commit).
  publish-web:
    needs: [verify, site, quality, spec-integrity]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: "publish-web"
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # Publish exactly what `site` built (with `verify` green) — no npm ci, no rebuild.
      - name: Download built docs
        uses: actions/download-artifact@v4
        with:
          name: pages-docs
          path: docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Publish to cogNNitive-web
        env:
          WEB_PUBLISH_TOKEN: ${{ secrets.WEB_PUBLISH_TOKEN }}
          INNFO_DOCS_OUT: ${{ github.workspace }}/docs
          WEB_PUBLISH_REPO: cogNNitive/cogNNitive-web
          WEB_PUBLISH_SUBDIR: docs
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/publish-web.mjs

  # UI smoke: Playwright (Chromium) over the committed TestLab console + hub
  # artifacts via file://. Standalone job — never blocks verify/quality/site,
  # never gates publishing. Run locally with `npm run test:ui`.
  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: UI smoke (TestLab console + hub)
        run: npm run test:ui

      - name: Upload UI screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-smoke-screenshots
          path: temp/ui-smoke
          retention-days: 7
