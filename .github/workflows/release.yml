name: Tag-Driven Release

on:
  push:
    tags:
      - 'skills-v*'
      - 'blueprints-v*'
      - 'nn-mcp-v*'
      - 'nn-console-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string
      publish:
        description: 'Publish for real (unchecked = dry-run)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install nn-sources skill dependencies
        run: npm ci --prefix skills/nn-sources

      - name: Build MCP packages for facts check
        run: npm --workspace=@cognnitive/nn-core run build && npm --workspace=@cognnitive/nn-mcp run build

      - name: Run Deterministic Verification
        run: node scripts/verify.js

      - name: Run Release
        id: run_release
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true') || vars.RELEASE_ENABLED != 'true' }}
          WEB_RELEASE_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const { runRelease } = require('./scripts/release/run-release.js');
            runRelease({
              tag: process.env.RELEASE_TAG,
              dryRun: process.env.DRY_RUN === 'true',
            }).then((res) => {
              console.log('Release completed successfully:', res);
            }).catch((err) => {
              console.error('Release failed:', err);
              process.exit(1);
            });
          "

      # Advisory: the assets + manifest are already published by the steps above.
      # The live smoke depends on GitHub API auth and CDN propagation, so it MUST
      # NOT gate the release status — a transient failure here is not an un-publish.
      # Investigate a red smoke step, but the release itself is done regardless.
      - name: Run Post-Publish Smoke Test (advisory)
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true') && vars.RELEASE_ENABLED == 'true'
        continue-on-error: true
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.WEB_RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          node -e "
            const { parseReleaseTag } = require('./scripts/release/parse-release-tag.js');
            const { runSmokeTest } = require('./scripts/release/smoke.js');
            const fs = require('fs');
            const path = require('path');
            const { key, version } = parseReleaseTag(process.env.RELEASE_TAG);
            const stagedManifestPath = path.join(process.cwd(), '.release-manifest.md');
            const stagedManifestText = fs.existsSync(stagedManifestPath)
              ? fs.readFileSync(stagedManifestPath, 'utf8')
              : '';
            runSmokeTest({
              key,
              version,
              stagedManifestText,
            }).catch((err) => {
              console.error('Smoke test failed:', err);
              process.exit(1);
            });
          "

      - name: Upload verify logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-logs
          path: .verify-logs
          include-hidden-files: true
          retention-days: 7
