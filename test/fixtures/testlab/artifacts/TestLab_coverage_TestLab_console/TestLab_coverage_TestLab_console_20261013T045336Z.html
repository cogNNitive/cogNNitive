    <title>iNNfo Console</title>
    <!--
    artifact_shell.html — thin console shell for innfo-console artifacts.

    Layout: a top navbar, a left blueprint rail whose slate filter zone holds the
    search + facets (Tags / Changes) and the blueprint cards (`#innfo-rail`), and
    a main area with a discreet 38px action bar above the runtime-rendered content.

    Generating agents MUST only:
      1. Declare capabilities in the innfo-config needs[] list below.
      2. Paste the Schema JSON Contract into #innfo-schema.
      3. Paste the Model JSON Contract into #innfo-model.
    The shared runtime (innfo-runtime.js, window.InnfoConsole) renders the rail
    cards, search, facets, cards, matrices, drafts and export modal.
    Do NOT inline runtime code here.
  -->
    <link rel="stylesheet" href="./innfo-ui.css" />
    <style>
      :root,
      [data-theme] {
        color-scheme: light;
        --bg: var(--innfo-bg);
        --surface: var(--innfo-surface);
        --surface-2: var(--innfo-surface-2);
        --surface-3: var(--innfo-border);
        --text: var(--innfo-text);
        --muted: var(--innfo-muted);
        --faint: var(--innfo-muted);
        --border: var(--innfo-border);
        --primary: var(--innfo-accent);
        --link: var(--innfo-link);
        --radius-sm: var(--innfo-radius-sm);
        --radius: var(--innfo-radius);
        --radius-lg: var(--innfo-radius-lg);
        --shadow-card: var(--innfo-shadow);
        --font: var(--innfo-font);
        --mono: var(--innfo-mono);
        --filter-zone-bg: var(--innfo-surface-2);
        --filter-box-border: var(--innfo-border);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--font);
        line-height: 1.55;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        -webkit-font-smoothing: antialiased;
      }
      code { font-family: var(--mono); font-size: 0.85em; }

      /* Top navbar */
      .innfo-navbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
        padding: 10px 20px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        position: sticky;
        top: 0;
        z-index: 30;
      }
      .innfo-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
      .innfo-badge-domain {
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.5px;
        text-transform: uppercase;
        color: #ffffff;
        background: var(--primary);
        border: 1px solid var(--primary);
        padding: 3px 8px;
        border-radius: var(--radius-sm);
      }
      .innfo-domain-title { margin: 0; font-size: var(--innfo-fs-title, 1.25rem); font-weight: 800; letter-spacing: -0.02em; }
      .innfo-mode { font-size: 0.8rem; color: var(--muted); }
      .innfo-mode strong { color: var(--text); }

      #innfo-layout { display: flex; flex: 1 1 auto; align-items: stretch; min-height: 0; }

      /* Left blueprint rail */
      aside.innfo-rail {
        width: 340px;
        min-width: 320px;
        max-width: 360px;
        border-right: 1px solid var(--border);
        background: var(--surface);
        display: flex;
        flex-direction: column;
        height: calc(100vh - 46px);
        position: sticky;
        top: 46px;
        overflow: hidden;
      }
      @media (max-width: 1024px) {
        .innfo-navbar { position: static; padding: 8px 12px; gap: 8px; }
        .innfo-action-bar { position: static; padding: 6px 12px; }
        #innfo-layout { flex-direction: column; }
        aside.innfo-rail {
          width: 100%;
          min-width: 0;
          max-width: 100%;
          height: auto;
          max-height: 340px;
          position: static;
          border-right: none;
          border-bottom: 1px solid var(--border);
        }
        .innfo-filter-zone { padding: 8px 10px; gap: 6px; }
        #innfo-rail { padding: 6px 8px; min-height: 150px; }
      }
      .innfo-filter-zone {
        background: var(--filter-zone-bg);
        border-bottom: 1px solid var(--filter-box-border);
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        flex-shrink: 0;
      }
      #innfo-search-wrap { position: relative; }
      #innfo-search-wrap .search-icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); display: flex; }
      #innfo-search {
        width: 100%;
        padding: 7px 12px 7px 34px;
        font: inherit;
        font-size: 0.85rem;
        background: var(--surface);
        border: 1px solid var(--filter-box-border);
        border-radius: var(--radius-sm);
      }
      #innfo-search:focus-visible { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 15%, transparent); }
      #innfo-rail { flex: 1; overflow-y: auto; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }

      /* Blueprint card (runtime renders one per model) */
      .innfo-bp-card {
        border: 1px solid var(--border);
        border-radius: var(--radius);
        background: var(--surface);
        padding: 10px 12px;
        cursor: pointer;
        box-shadow: var(--shadow-card);
        transition: transform 0.12s ease, border-color 0.12s ease;
      }
      .innfo-bp-card:hover { transform: translateY(-1px); border-color: var(--muted); }
      .innfo-bp-card.active { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 6%, var(--surface)); }
      .innfo-bp-card .bp-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
      .innfo-bp-card .bp-version { color: var(--muted); font-family: var(--mono); font-weight: 500; text-transform: none; }
      .innfo-bp-card .bp-title { font-size: 0.9rem; font-weight: 700; margin: 4px 0 3px; line-height: 1.3; }
      .innfo-bp-card .bp-meta { display: flex; gap: 10px; font-size: 0.72rem; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 5px; margin-top: 5px; }
      .innfo-bp-card .bp-changes { font-size: 0.66rem; font-weight: 700; color: var(--warning); background: color-mix(in srgb, var(--warning) 16%, var(--surface)); border: 1px solid color-mix(in srgb, var(--warning) 35%, var(--surface)); padding: 1px 6px; border-radius: 999px; }

      main { flex: 1; min-width: 0; padding: 0; display: flex; flex-direction: column; }
      @media (max-width: 640px) {
        main { padding: 0; }
        .innfo-content-scroll { padding: 12px 12px 64px; }
      }
      .innfo-action-bar {
        min-height: 40px;
        padding: 6px 30px;
        background: var(--surface);
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        position: sticky;
        top: 45px;
        z-index: 25;
        box-shadow: 0 1px 2px rgba(25, 23, 36, 0.03);
      }
      @media (max-width: 1024px) {
        .innfo-action-bar { position: static; top: auto; }
      }
      .innfo-content-scroll { flex: 1; overflow-y: auto; padding: 22px 30px 90px; max-width: 1200px; width: 100%; box-sizing: border-box; }

      /* Runtime regions (kept identical to the previous shell) */
      .innfo-facet-dropdown { position: relative; display: inline-block; }
      .innfo-facet-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 0.8rem; font-weight: 600; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer; }
      .innfo-facet-btn.active { border-color: var(--primary); color: var(--primary); }
      .innfo-facet-menu { position: absolute; top: calc(100% + 4px); left: 0; z-index: 50; min-width: 220px; max-height: 340px; overflow-y: auto; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.15); padding: 6px; display: none; }
      .innfo-facet-menu.open { display: block; }
      .innfo-facet-item { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-sm); font-size: 0.82rem; cursor: pointer; }
      .innfo-facet-item:hover { background: var(--surface-2); }
      .innfo-view-tabs { display: flex; gap: 6px; flex-wrap: wrap; }
      .innfo-view-tab { appearance: none; border: 1px solid transparent; background: transparent; color: var(--muted); font: inherit; font-size: 0.83rem; font-weight: 600; padding: 6px 12px; border-radius: var(--radius-sm); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
      .innfo-view-tab:hover { color: var(--text); background: var(--surface-2); }
      .innfo-view-tab.active { color: var(--primary); border-color: var(--primary); background: color-mix(in srgb, var(--primary) 8%, var(--surface)); }
      .innfo-tab-panel { display: none; padding: 22px 30px 90px; }
      .innfo-tab-panel.active { display: block; }
      @media (max-width: 640px) {
        .innfo-tab-panel { padding: 12px 12px 64px; }
      }
      .innfo-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; margin-bottom: 14px; box-shadow: var(--shadow-card); }
      .innfo-card h3 { margin: 0 0 4px; font-size: 1.05rem; font-weight: 700; }
      .innfo-card-fields dt { color: var(--muted); font-weight: 600; }
      .innfo-matrix table { border-collapse: collapse; font-size: 0.82rem; width: 100%; }
      .innfo-matrix th, .innfo-matrix td { border: 1px solid var(--border); padding: 6px 10px; text-align: left; }
      .innfo-matrix td.innfo-matrix-cell-empty .innfo-ku-badge { opacity: 0.38; border-style: dotted; }
      .empty-state { color: var(--muted); font-size: 0.9rem; padding: 40px 0; }

      /* Model Explorer cards/table toggle + element table */
      .innfo-explorer-toolbar { display: flex; justify-content: flex-end; margin: 0 0 12px; }
      .innfo-viewmode { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }
      .innfo-viewmode-btn { appearance: none; border: none; background: var(--surface); color: var(--muted); font: inherit; font-size: 0.8rem; font-weight: 600; padding: 5px 12px; cursor: pointer; }
      .innfo-viewmode-btn + .innfo-viewmode-btn { border-left: 1px solid var(--border); }
      .innfo-viewmode-btn:hover { color: var(--text); background: var(--surface-2); }
      .innfo-viewmode-btn.active { color: var(--primary); background: color-mix(in srgb, var(--primary) 10%, var(--surface)); }
      .innfo-element-table-wrap { overflow: auto; border: 1px solid var(--border); border-radius: var(--radius); }
      .innfo-element-table { border-collapse: collapse; width: 100%; font-size: 0.82rem; }
      .innfo-element-table th, .innfo-element-table td { border-bottom: 1px solid var(--border); padding: 6px 10px; text-align: left; vertical-align: top; max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .innfo-element-table thead th { position: sticky; top: 0; z-index: 5; background: var(--surface-2); cursor: pointer; user-select: none; }
      .innfo-element-table thead th:hover { color: var(--text); }
      .innfo-element-table thead th.sorted { color: var(--primary); }
      .innfo-element-table-sort { margin-left: 4px; font-size: 0.7rem; }
      .innfo-element-table tbody tr:hover { background: var(--surface-2); }
      .innfo-element-table-name { font-weight: 600; }
      .innfo-element-table-empty { color: var(--muted); text-align: center; padding: 30px 0; }

      /* Concept guidance sidebar (right) */
      aside.innfo-guide { width: 320px; min-width: 280px; max-width: 340px; border-left: 1px solid var(--border); background: var(--surface); padding: 16px 18px; overflow-y: auto; height: calc(100vh - 57px); position: sticky; top: 57px; }
      @media (max-width: 1100px) { aside.innfo-guide { display: none; } }
      .innfo-guide-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
      .innfo-guide-desc { font-size: 0.84rem; color: var(--muted); margin: 0 0 14px; }
      .innfo-guide-section { margin-bottom: 14px; }
      .innfo-guide-title { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); margin: 0 0 6px; }
      .innfo-guide-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; font-size: 0.8rem; }
      .innfo-guide-list dt { color: var(--muted); font-weight: 600; }
      .innfo-guide-list li { font-size: 0.8rem; }
      .innfo-guide-meta { font-size: 0.72rem; color: var(--muted); border-top: 1px dashed var(--border); padding-top: 8px; }

      /* Sankey relation flow (KU modal Connections tab) */
      .innfo-sankey { width: 100%; overflow-x: auto; }
      .innfo-sankey-svg { width: 100%; height: auto; min-width: 520px; }
      .innfo-sankey-node { fill: var(--surface-2); stroke: var(--border); stroke-width: 1; }
      .innfo-sankey-center { fill: color-mix(in srgb, var(--primary) 14%, var(--surface)); stroke: var(--primary); }
      .innfo-sankey-link { fill: none; stroke: color-mix(in srgb, var(--primary) 45%, var(--border)); stroke-width: 1.6; opacity: 0.8; }
      .innfo-sankey-label { font-size: 12px; fill: var(--text); }
      .innfo-sankey-field { font-size: 10px; fill: var(--muted); font-family: var(--mono); }
      .innfo-sankey-center-label { font-size: 12px; font-weight: 700; fill: var(--primary); }
      .innfo-sankey-empty { color: var(--muted); font-size: 0.9rem; padding: 20px 0; }

      /* Media lightbox */
      #innfo-media-dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; max-width: min(880px, 92vw); width: 100%; background: var(--surface); color: var(--text); }
      #innfo-media-dialog::backdrop { background: rgba(0, 0, 0, 0.55); }
      .innfo-media-body { padding: 0 16px 16px; display: flex; flex-direction: column; gap: 12px; }
      .innfo-media-image { max-width: 100%; max-height: 70vh; object-fit: contain; align-self: center; border-radius: var(--radius); }
      .innfo-media-bar { display: flex; align-items: center; gap: 12px; }
      .innfo-media-nav { appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--text); border-radius: var(--radius-sm); font-size: 1rem; line-height: 1; padding: 4px 12px; cursor: pointer; }
      .innfo-media-nav:disabled { opacity: 0.4; cursor: default; }
      .innfo-media-count { font-size: 0.8rem; color: var(--muted); font-family: var(--mono); }
      .innfo-media-download { margin-left: auto; font-size: 0.8rem; color: var(--link); }
      .innfo-card-thumb--zoom { cursor: zoom-in; }

      /* Type-aware field values */
      .innfo-field-bool { font-weight: 600; }
      .innfo-field-bool[data-value="true"] { color: var(--primary); }
      .innfo-field-bool[data-value="false"] { color: var(--muted); }

      /* Incoming relations on cards */
      .innfo-card-incoming { margin-top: 8px; }

      /* Field detail dialog */
      #innfo-field-dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; max-width: min(720px, 92vw); width: 100%; background: var(--surface); color: var(--text); }
      #innfo-field-dialog::backdrop { background: rgba(0, 0, 0, 0.45); }
      .innfo-field-detail-body { padding: 0 16px 16px; }
      .innfo-field-detail-meta { font-size: 0.8rem; color: var(--muted); margin: 0 0 8px; }
      .innfo-field-detail-value { white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 0.82rem; background: var(--surface-2); border-radius: var(--radius-sm); padding: 10px 12px; }

      /* Metamodel map */
      .innfo-metamodel { display: flex; justify-content: center; padding: 12px 0; }
      .innfo-metamodel-svg { width: 100%; max-width: 620px; height: auto; }
      .innfo-metamodel-node { fill: color-mix(in srgb, var(--primary) 12%, var(--surface)); stroke: var(--primary); stroke-width: 1.4; }
      .innfo-metamodel-label { font-size: 12px; fill: var(--text); font-weight: 600; }
      .innfo-metamodel-edge { stroke: color-mix(in srgb, var(--primary) 40%, var(--border)); stroke-width: 1.5; }
      .innfo-metamodel-edge-label { font-size: 10px; fill: var(--muted); font-family: var(--mono); }
      .innfo-reviewer-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: var(--muted); }
      .innfo-reviewer-name { width: 9rem; padding: 4px 8px; font: inherit; background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); }
      .innfo-rail-badge, .innfo-card-badge { display: inline-flex; align-items: center; justify-content: center; background: var(--danger); color: #fff; font-size: 0.7rem; font-weight: 700; border-radius: 999px; padding: 1px 6px; min-width: 16px; height: 16px; }
      .innfo-highlight { animation: innfo-pulse-glow 2.5s ease-out; }
      @keyframes innfo-pulse-glow { 0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--primary) 50%, transparent); } 100% { box-shadow: var(--shadow-card); } }
      #innfo-ref-dialog { border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 0; max-width: 480px; width: 100%; background: var(--surface); color: var(--text); }
      #innfo-ref-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
    </style>
  </head>
